{% extends "base.html" %}

{% block title %}Карта — игроки{% endblock %}

{% block head %}
<link rel="stylesheet" href="/static/maplibre-gl.css">
<script src="/static/maplibre-gl.js"></script>
{% raw %}
<style>
  #map { position: absolute; inset: 0; }
  .maplibregl-popup-content { padding: 8px 10px; }
</style>
{% endraw %}
{% endblock %}

{% block body %}
<div class="h-screen flex flex-col">
  {% include "_nav.html" %}
  <div class="flex-1 min-h-0 flex">
    <div class="relative flex-1">
      <div id="map"></div>
      <div class="absolute top-3 left-3 z-10 bg-white/90 rounded-md shadow px-3 py-2 text-xs space-y-1">
        <div class="font-semibold text-slate-700">Игроки STALKER</div>
        <div class="flex items-center gap-2"><span class="inline-block w-3 h-3 rounded-full bg-emerald-500"></span> в сети</div>
        <div class="flex items-center gap-2"><span class="inline-block w-3 h-3 rounded-full bg-amber-500"></span> радиация</div>
        <div class="flex items-center gap-2"><span class="inline-block w-3 h-3 rounded-full bg-red-600"></span> угроза</div>
        <div id="conn" class="pt-1 text-slate-500">поток: подключение…</div>
      </div>
    </div>
    <aside class="w-80 shrink-0 bg-white border-l border-slate-200 overflow-y-auto">
      <div class="p-3 border-b border-slate-200">
        <div class="text-sm font-semibold text-slate-700">Игроки <span id="p-count" class="text-slate-400"></span></div>
      </div>
      <ul id="p-list" class="divide-y divide-slate-100 text-sm"></ul>
    </aside>
  </div>
</div>

{% raw %}
<script>
(function () {
  const OSM_STYLE = {
    version: 8,
    sources: { osm: { type: 'raster', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256, attribution: '© OpenStreetMap contributors' } },
    layers: [{ id: 'osm', type: 'raster', source: 'osm' }]
  };
  const map = new maplibregl.Map({ container: 'map', style: OSM_STYLE, center: [37.6173, 55.7558], zoom: 9 });
  map.addControl(new maplibregl.NavigationControl(), 'top-right');
  map.addControl(new maplibregl.ScaleControl());

  const byId = new Map();
  const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const collection = () => ({ type: 'FeatureCollection', features: [...byId.values()] });

  function timeago(ts) {
    if (!ts) return '';
    const t = Date.parse(ts.replace(' ', 'T') + 'Z');
    if (isNaN(t)) return '';
    const s = Math.max(0, (Date.now() - t) / 1000);
    if (s < 60) return Math.floor(s) + ' с назад';
    if (s < 3600) return Math.floor(s / 60) + ' мин назад';
    if (s < 86400) return Math.floor(s / 3600) + ' ч назад';
    return Math.floor(s / 86400) + ' дн назад';
  }
  function healthColor(h) { return h == null ? '#94a3b8' : (h >= 66 ? '#10b981' : (h >= 33 ? '#f59e0b' : '#dc2626')); }
  function threatBadge(t) {
    const m = { high: ['#fee2e2', '#991b1b', 'высокая'], low: ['#fef3c7', '#92400e', 'низкая'], none: ['#e2e8f0', '#334155', 'нет'] };
    const v = m[t] || m.none;
    return '<span style="background:' + v[0] + ';color:' + v[1] + ';padding:1px 7px;border-radius:9999px;font-size:11px;font-weight:500">угроза: ' + v[2] + '</span>';
  }
  // Полоса «подпись — значение — прогресс». pct 0..100.
  function bar(label, valueText, pct, color) {
    return '<div style="margin:4px 0">'
      + '<div style="display:flex;justify-content:space-between;color:#475569"><span>' + label + '</span>'
      + '<span style="font-weight:600;color:#0f172a">' + valueText + '</span></div>'
      + '<div style="height:5px;background:#e2e8f0;border-radius:9999px;overflow:hidden;margin-top:2px">'
      + '<div style="height:100%;width:' + Math.max(0, Math.min(100, pct)) + '%;background:' + color + '"></div></div></div>';
  }
  // Карточка телеметрии игрока для всплывающего окна. Радиация нормируется на
  // игровой максимум 16 (MAX_RADIATION в core/player/PlayerProps).
  function playerCard(p) {
    const hp = p.health != null ? Math.round(p.health) : null;
    const rad = p.radiation != null ? Number(p.radiation) : null;
    const seen = timeago(p.last_seen_at);
    return '<div style="min-width:190px;font-size:12px;line-height:1.35">'
      + '<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">'
      + '<span style="width:8px;height:8px;border-radius:9999px;background:' + (p.is_online ? '#10b981' : '#94a3b8') + '"></span>'
      + '<span style="font-weight:600;font-size:13px">' + esc(p.display_name || p.serial || ('#' + p.device_id)) + '</span></div>'
      + '<div style="margin-bottom:2px">' + threatBadge(p.threat_level) + '</div>'
      + bar('Здоровье', hp != null ? hp : '—', hp != null ? hp : 0, healthColor(hp))
      + bar('Радиация', rad != null ? rad.toFixed(2) : '—', rad != null ? rad / 16 * 100 : 0, rad != null && rad > 1 ? '#f59e0b' : '#38bdf8')
      + '<div style="display:flex;justify-content:space-between;color:#64748b;margin-top:6px;font-size:11px">'
      + '<span>' + (p.battery_pct != null ? 'бат. ' + p.battery_pct + '%' : '') + '</span>'
      + '<span>' + (seen ? 'замечен ' + seen : '') + '</span></div></div>';
  }

  // Цвет игрока: угроза высокая → красный, радиация заметная → янтарный,
  // иначе онлайн → зелёный, оффлайн → серый.
  function refresh() {
    const src = map.getSource('players');
    if (src) src.setData(collection());
    renderList();
  }

  function renderList() {
    const ul = document.getElementById('p-list');
    const items = [...byId.values()];
    document.getElementById('p-count').textContent = '(' + items.length + ')';
    ul.innerHTML = '';
    for (const f of items) {
      const p = f.properties;
      const li = document.createElement('li');
      li.className = 'px-3 py-2 hover:bg-slate-50 cursor-pointer';
      li.innerHTML = '<div class="flex items-center gap-2">' +
        '<span class="inline-block w-2.5 h-2.5 rounded-full ' + (p.is_online ? 'bg-emerald-500' : 'bg-slate-400') + '"></span>' +
        '<span class="font-medium">' + esc(p.display_name || p.serial || ('#' + p.device_id)) + '</span></div>' +
        '<div class="text-xs text-slate-500">' +
        (p.health != null ? 'HP ' + Math.round(p.health) + ' · ' : '') +
        (p.radiation != null ? 'рад ' + Number(p.radiation).toFixed(2) + ' · ' : '') +
        (p.threat_level ? 'угроза: ' + esc(p.threat_level) : 'спокойно') + '</div>';
      li.onclick = () => map.easeTo({ center: f.geometry.coordinates, zoom: Math.max(map.getZoom(), 14) });
      ul.appendChild(li);
    }
  }

  let fitted = false;
  async function loadAll() {
    try {
      const fc = await fetch('/api/v1/geo/players', { credentials: 'same-origin' }).then(r => r.json());
      byId.clear();
      (fc.features || []).forEach(f => byId.set(f.properties.device_id, f));
      refresh();
      if (!fitted && byId.size) {
        const b = new maplibregl.LngLatBounds();
        byId.forEach(f => b.extend(f.geometry.coordinates));
        map.fitBounds(b, { padding: 60, maxZoom: 15 });
        fitted = true;
      }
    } catch (e) { /* transient */ }
  }

  map.on('load', () => {
    map.addSource('players', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
    map.addLayer({
      id: 'players', type: 'circle', source: 'players',
      paint: {
        'circle-radius': 7,
        'circle-color': ['case',
          ['==', ['get', 'threat_level'], 'high'], '#dc2626',
          ['>', ['coalesce', ['get', 'radiation'], 0], 1], '#f59e0b',
          ['boolean', ['get', 'is_online'], false], '#10b981',
          '#94a3b8'],
        'circle-stroke-width': 2, 'circle-stroke-color': '#fff'
      }
    });
    map.on('click', 'players', (e) => {
      new maplibregl.Popup({ maxWidth: '260px' })
        .setLngLat(e.features[0].geometry.coordinates)
        .setHTML(playerCard(e.features[0].properties))
        .addTo(map);
    });
    map.on('mouseenter', 'players', () => map.getCanvas().style.cursor = 'pointer');
    map.on('mouseleave', 'players', () => map.getCanvas().style.cursor = '');

    loadAll();
    // Живой поток: на события position/player перезагружаем игроков (простая,
    // надёжная стратегия — состояние приходит редко и малым объёмом).
    const es = new EventSource('/api/v1/live/stream', { withCredentials: true });
    const conn = document.getElementById('conn');
    es.onopen = () => { conn.textContent = 'поток: подключён'; };
    es.onerror = () => { conn.textContent = 'поток: переподключение…'; };
    let pending = false;
    const scheduleReload = () => {
      if (pending) return; pending = true;
      setTimeout(() => { pending = false; loadAll(); }, 1000);
    };
    es.addEventListener('player', scheduleReload);
    es.addEventListener('position', scheduleReload);
  });
})();
</script>
{% endraw %}
{% endblock %}
